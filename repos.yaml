# repos.yaml — which repositories the pipeline ingests.
#
# 1) Direct list: exact repositories to load, one per line (OWNER/NAME).
#    These are always ingested, regardless of the topic discovery below.
repos:
  - GokuMohandas/Made-With-ML
  - apache/airflow
  - DataTalksClub/data-engineering-zoomcamp
  - eugeneyan/applied-ml
  - qdrant/qdrant
  - HumanSignal/label-studio
  - mlflow/mlflow
  - torvalds/linux
  - facebook/react
  - microsoft/vscode
  - apache/superset

# 2) Topic discovery: the most-starred repositories for each GitHub topic are
#    fetched automatically from the GitHub Search API at run time (needs a
#    valid GITHUB_TOKEN in .env, and the token needs search access).
#
#      name: any topic from https://github.com/topics
#      top:  how many of the top-starred repos to take per topic (default 10)
#
#    Discovery keeps only popular, live, non-fork repositories
#    (`stars:>=1000 archived:false fork:false`) and results are deduplicated
#    against the direct list and across topics.
#
#    ~31 topics (27 x top: 8 + 4 x top: 4) -> ~170-190 unique repos after dedupe.
topics:
  # --- Data engineering -----------------------------------------------------
  - name: data-engineering
    top: 8
  - name: etl
    top: 8

  # --- ML / AI --------------------------------------------------------------
  - name: machine-learning
    top: 8
  - name: llm
    top: 8
  - name: ai-agents
    top: 8

  # --- Web / frontend -------------------------------------------------------
  - name: react
    top: 8
  - name: django
    top: 8

  # --- DevOps / CI-CD -------------------------------------------------------
  - name: kubernetes
    top: 8
  - name: terraform
    top: 8
  - name: ci-cd
    top: 8

  # --- Databases ------------------------------------------------------------
  - name: postgresql
    top: 8
  - name: database
    top: 8

  # --- Systems / languages --------------------------------------------------
  - name: rust
    top: 8
  - name: golang
    top: 8

  # --- Mobile ---------------------------------------------------------------
  - name: android
    top: 8
  - name: flutter
    top: 8

  # --- Security -------------------------------------------------------------
  - name: security
    top: 8
  - name: pentesting
    top: 8

  # --- Testing --------------------------------------------------------------
  - name: testing
    top: 8
  - name: automation
    top: 8

  # --- Observability --------------------------------------------------------
  - name: monitoring
    top: 8
  - name: prometheus
    top: 8

  # --- Cloud ----------------------------------------------------------------
  - name: aws
    top: 8
  - name: azure
    top: 8

  # --- Data visualization ---------------------------------------------------
  - name: visualization
    top: 8
  - name: chart
    top: 8

  # --- Messaging / infra ----------------------------------------------------
  - name: message-queue
    top: 8

  # --- Emerging -------------------------------------------------------------
  - name: blockchain
    top: 4
  - name: gamedev
    top: 4
  - name: embedded
    top: 4
  - name: iot
    top: 4
